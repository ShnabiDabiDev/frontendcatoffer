    <script>
        (function () {
            const RIPPLE_DURATION = 200;
            const FADE_DURATION = 360;

    function createRipple(button, event) {
        // Удаляем предыдущий эффект
        button.querySelectorAll('.ripple-fill').forEach(ripple => {
            ripple.remove();
        });

        const rect = button.getBoundingClientRect();

        // Точка клика внутри кнопки
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        // Находим максимальное расстояние от точки клика
        // до углов кнопки
        const distance = Math.max(
            Math.hypot(x, y),
            Math.hypot(rect.width - x, y),
            Math.hypot(x, rect.height - y),
            Math.hypot(rect.width - x, rect.height - y)
        );

        const size = distance * 2;

        // Создаём ripple
        const ripple = document.createElement('span');

        ripple.className = 'ripple-fill';

        ripple.style.width = `${size}px`;
        ripple.style.height = `${size}px`;

        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;

        ripple.style.opacity = '0.16';

        ripple.style.transform =
            'translate(-50%, -50%) scale(0.02)';

        button.appendChild(ripple);

        ripple.offsetWidth;

        // Расширение
        ripple.style.transition =
            `transform ${RIPPLE_DURATION}ms ease-in`;

        ripple.style.transform =
            'translate(-50%, -50%) scale(1)';
        button.classList.add('add')
        setTimeout(() => {
            ripple.style.transition =
                `opacity ${FADE_DURATION}ms ease-out`;

            ripple.style.opacity = '0';

            setTimeout(() => {
                ripple.remove();
            }, FADE_DURATION);

        }, RIPPLE_DURATION);
    }


    // =========================
    // FILTERS
    // =========================

    const faq = document.querySelector('.faq');

    if (faq) {
        faq.addEventListener('pointerdown', function (event) {
            createRipple(this, event);
        });
    }


    // =========================
    // FEED
    // =========================

    const feed = document.querySelector('.feed');

    if (feed) {
        feed.addEventListener('pointerdown', function (event) {
            createRipple(this, event);
        });
    }

    const acc = document.querySelector('.acc');

    if (acc) {
        acc.addEventListener('pointerdown', function (event) {
            createRipple(this, event);
        });
    }

    const home = document.querySelector('.home');

    if (home) {
        home.addEventListener('pointerdown', function (event) {
            createRipple(this, event);
        });
    }

})();

    </script>
    
    <script>
        (function () {
            const socket = io('backendcatoffer-production.up.railway.app', {
                transports: ['websocket', 'polling'],
            });
            const chatMiddle = document.querySelector('.chatmiddle');
            const input     = document.querySelector('.textchat');
            const sendBtn    = document.querySelector('.buttonarrow');

            if (!chatMiddle || !input || !sendBtn) {
                console.error('Чат: не найдены элементы', { chatMiddle, input, sendBtn });
                return;
            }

            function nowTime() {
                const d = new Date();
                return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            }

            function scrollToBottom() {
                chatMiddle.scrollTop = chatMiddle.scrollHeight;
            }

            function createMessage(text, name = 'You', avatarSrc = 'icons/Avaa.svg') {
                const wrapper = document.createElement('div');
                wrapper.className = 'meassagewrapper';

                const avatar = document.createElement('img');
                avatar.className = 'Avatarmeassage';
                avatar.src = avatarSrc;
                avatar.alt = '';

                const nameTime = document.createElement('div');
                nameTime.className = 'name-time';

                const chatName = document.createElement('div');
                chatName.className = 'chat-name';
                chatName.textContent = name;

                const time = document.createElement('div');
                time.className = 'meassagetime';
                time.textContent = nowTime();

                nameTime.append(chatName, time);

                const message = document.createElement('div');
                message.className = 'usermeassage';
                message.textContent = text;

                wrapper.append(avatar, nameTime, message);
                return wrapper;
            }

            function sendMessage() {
                const text = input.value.trim();
                if (!text) return;

                const node = createMessage(text);
                socket.emit('sendmeasseage', text)
                // сработает анимация fade-in-up
                node.classList.add('msg-appear');

                // чтобы анимация не проигрывалась повторно (например, при resize)
                node.addEventListener('animationend', () => {
                    node.classList.remove('msg-appear');
                }, { once: true });

                chatMiddle.appendChild(node);

                input.value = '';
                input.focus();

                requestAnimationFrame(scrollToBottom);
            }

            sendBtn.addEventListener('click', sendMessage);

            socket.on('createmeassage', (data) => {
                console.log(data)
                // createMessage(data)
            })

            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            /* ================= БИНД НА "/" ================= */
            document.addEventListener('keydown', function (e) {
                const isSlash = e.key === '/' || e.code === 'Slash' || e.keyCode === 191;
                if (!isSlash) return;

                const active = document.activeElement;

                if (active === input) return;
                if (active && (
                    active.tagName === 'INPUT' ||
                    active.tagName === 'TEXTAREA' ||
                    active.isContentEditable
                )) return;

                e.preventDefault();
                e.stopPropagation();
                input.focus();
            }, true);

            window.addEventListener('load', scrollToBottom);
    })();
    </script>
